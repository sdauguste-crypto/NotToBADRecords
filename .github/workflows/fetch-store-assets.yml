name: Fetch store assets

# Downloads the generated product mockups listed in scripts/store-assets.json,
# converts them to webp, and commits them to public/store/ on the branch the
# workflow was dispatched from. Exists because the authoring environment can
# only reach GitHub, while the image CDN is open from Actions runners.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y webp jq

      - name: Download and convert
        run: |
          mkdir -p public/store
          jq -c '.assets[]' scripts/store-assets.json | while read -r row; do
            file=$(echo "$row" | jq -r .file)
            url=$(echo "$row" | jq -r .url)
            width=$(echo "$row" | jq -r .width)
            echo "Fetching $file"
            curl -sSfL --retry 3 -o /tmp/src.png "$url"
            cwebp -quiet -q 82 -resize "$width" 0 /tmp/src.png -o "public/store/$file"
          done
          ls -la public/store

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/store
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add generated store product imagery"
          git push
